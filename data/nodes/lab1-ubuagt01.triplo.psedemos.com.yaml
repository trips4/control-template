# Encrypted password.  Protects data on disk and in repo.
profile::demo::secrets::insecure_password: 'ENC[PKCS7,]'

# Encrypted password as Sensitive data type
profile::demo::secrets::sensitive_password: 'ENC[PKCS7,]'
lookup_options:
  profile::demo::secrets::sensitive_password:
    convert_to: "Sensitive"

