puppet_enterprise::profile::master::code_manager_auto_configure: true
puppet_enterprise::profile::master::r10k_known_hosts:
  - name: "github.com"
    type: "ed25519"
    key: ""
puppet_enterprise::master::code_manager::git_settings:
  #private-key: "/etc/puppetlabs/puppetserver/ssh/id-control-repo.ed25519"
  repositories:
    - remote: "git@github.com:trips4/control-template.git"
      private-key: "/etc/puppetlabs/puppetserver/ssh/id-control-repo.ed25519"
    - remote: "git@github.com:trips4/control_client.git"
      private-key: "/etc/puppetlabs/puppetserver/ssh/id-control-repo.ed25519"
puppet_enterprise::master::code_manager::sources:
  puppet:
    remote: "git@github.com:trips4/control-template.git"
    prefix: false
  cust_1:
    remote: "git@github.com:trips4/control_client.git"
    prefix: true